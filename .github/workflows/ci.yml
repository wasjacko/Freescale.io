name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check lockfile
        id: lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::No pnpm-lock.yaml yet — early scaffold mode, skipping checks"
          fi

      - name: Setup pnpm
        if: steps.lockfile.outputs.exists == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        if: steps.lockfile.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        if: steps.lockfile.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.lockfile.outputs.exists == 'true'
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck
        if: steps.lockfile.outputs.exists == 'true'
        run: pnpm typecheck
        continue-on-error: true

      - name: Test
        if: steps.lockfile.outputs.exists == 'true'
        run: pnpm test
        continue-on-error: true
